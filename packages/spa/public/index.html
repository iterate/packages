<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iterate static SPA</title>
    <!-- No build: the one dependency, capnweb, comes from a CDN through a native import map. -->
    <script type="importmap">
      {
        "imports": { "@iterate-com/capnweb": "https://esm.iterate.com/@iterate-com/capnweb@0.12.3" }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        max-width: 640px;
        margin: 48px auto;
        padding: 0 24px;
        font:
          16px/1.6 system-ui,
          sans-serif;
        color: #eeeeee;
        background: #111111;
      }
      h1 {
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      code {
        font-size: 0.9em;
        background: #222222;
        padding: 0 4px;
        border-radius: 3px;
      }
      button {
        font: inherit;
        cursor: pointer;
        padding: 6px 14px;
        border: 1px solid #444444;
        border-radius: 6px;
        color: inherit;
        background: #222222;
      }
      ul {
        padding-left: 20px;
      }
      li {
        margin: 8px 0;
      }
      .muted {
        color: #aaaaaa;
        font-size: 0.9em;
      }
      [role="alert"] {
        color: #ff8080;
      }
    </style>
  </head>
  <body>
    <main id="app"><p class="muted">Loading…</p></main>
    <p><a href="/downloads/">Get the Chrome extension</a></p>
    <script type="module" src="./app.js"></script>
  </body>
</html>
