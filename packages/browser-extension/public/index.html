<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iterate</title>
    <style>
      /* shadcn's neutral theme, the values of the mind apps' theme.css
         (core/configs/default/apps/theme.css), following the system's light or dark mode. */
      :root {
        color-scheme: light dark;
        --radius: 0.625rem;
        --background: light-dark(oklch(1 0 0), oklch(0.145 0 0));
        --foreground: light-dark(oklch(0.145 0 0), oklch(0.985 0 0));
        --card: light-dark(oklch(1 0 0), oklch(0.205 0 0));
        --primary: light-dark(oklch(0.205 0 0), oklch(0.922 0 0));
        --primary-foreground: light-dark(oklch(0.985 0 0), oklch(0.205 0 0));
        --muted: light-dark(oklch(0.97 0 0), oklch(0.269 0 0));
        --muted-foreground: light-dark(oklch(0.556 0 0), oklch(0.708 0 0));
        --accent: light-dark(oklch(0.97 0 0), oklch(0.269 0 0));
        --destructive: light-dark(oklch(0.577 0.245 27.325), oklch(0.704 0.191 22.216));
        --success: light-dark(oklch(0.627 0.194 149.214), oklch(0.723 0.219 149.579));
        --warning: light-dark(oklch(0.666 0.179 58.318), oklch(0.769 0.188 70.08));
        --border: light-dark(oklch(0.922 0 0), oklch(1 0 0 / 10%));
        --input: light-dark(oklch(0.922 0 0), oklch(1 0 0 / 15%));
        --ring: light-dark(oklch(0.708 0 0), oklch(0.556 0 0));
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        font:
          14px/1.5 Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        color: var(--foreground);
        background: var(--background);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 280px;
        /* Chrome's own style sheet for extension pages sets body to 75% */
        font: inherit;
      }
      /* minmax(0, 1fr): a long URL truncates instead of widening the panel */
      main,
      .stack,
      .card,
      .tabs {
        grid-template-columns: minmax(0, 1fr);
      }
      main {
        display: grid;
        gap: 12px;
        padding: 16px;
        align-content: start;
      }
      h1,
      h2,
      p,
      ul,
      dl,
      dd {
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 600;
      }
      .brand img {
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .card {
        display: grid;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .card-head {
        display: grid;
        gap: 2px;
      }
      h2 {
        font-size: 14px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: calc(var(--radius) - 2px);
        font: inherit;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s,
          opacity 0.15s;
      }
      .btn:focus-visible,
      .input:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
        border-color: var(--ring);
      }
      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .btn-primary {
        color: var(--primary-foreground);
        background: var(--primary);
      }
      .btn-primary:hover {
        background: color-mix(in oklch, var(--primary) 90%, transparent);
      }
      .btn-outline {
        color: var(--foreground);
        background: var(--background);
        border-color: var(--border);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .btn-outline:hover,
      .btn-ghost:hover {
        background: var(--accent);
      }
      .btn-ghost {
        color: var(--foreground);
        background: transparent;
      }
      .btn-sm {
        height: 32px;
        padding: 0 10px;
        font-size: 13px;
      }
      .btn-block {
        width: 100%;
      }
      .field {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
      }
      .input {
        height: 36px;
        width: 100%;
        padding: 0 12px;
        border: 1px solid var(--input);
        border-radius: calc(var(--radius) - 2px);
        font: inherit;
        color: var(--foreground);
        background: transparent;
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 4px);
        font-size: 12px;
        font-weight: 500;
        color: var(--muted-foreground);
      }
      code,
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--muted);
        overflow-wrap: anywhere;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--muted-foreground);
      }
      .dot.ok {
        background: var(--success);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--success) 20%, transparent);
      }
      .dot.wait {
        background: var(--warning);
      }
      .dot.bad {
        background: var(--destructive);
      }
      .facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-size: 13px;
      }
      .facts dt {
        color: var(--muted-foreground);
      }
      .facts dd {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .tabs {
        display: grid;
        padding: 0;
        list-style: none;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
      }
      .tabs li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 8px 8px 12px;
      }
      .tabs li + li {
        border-top: 1px solid var(--border);
      }
      .tabs .empty {
        color: var(--muted-foreground);
        font-size: 13px;
        padding: 12px;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .title {
        font-size: 13px;
        font-weight: 500;
      }
      .rename {
        margin-top: 8px;
      }
      details summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      pre {
        margin: 8px 0 0;
        padding: 10px 12px;
        max-height: 260px;
        overflow: auto;
        border-radius: calc(var(--radius) - 2px);
        background: var(--muted);
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.5;
        white-space: pre-wrap;
        user-select: text;
      }
      .error {
        color: var(--destructive);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
